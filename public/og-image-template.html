<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterSiquijor Social Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 64px 72px;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: linear-gradient(135deg, #0052bc 0%, #0066eb 55%, #003d8d 100%);
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 56px;
        color: #ffffff;
      }
      .copy {
        max-width: 720px;
      }
      .eyebrow {
        display: inline-block;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.28);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 64px;
        line-height: 1.08;
        margin: 0 0 20px;
        font-weight: 800;
      }
      p {
        font-size: 28px;
        line-height: 1.4;
        margin: 0 0 28px;
        color: rgba(255, 255, 255, 0.92);
      }
      .meta {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.84);
      }
      .mark {
        width: 260px;
        height: 260px;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 36px;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark img {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="eyebrow">Independent Community Portal</div>
      <h1>BetterSiquijor</h1>
      <p>
        Service guides, schools and colleges, hospitals, police stations, and
        public records for Siquijor Province.
      </p>
      <div class="meta">bettersiquijor.vercel.app · Not an official government website</div>
    </div>
    <div class="mark">
      <img src="/better-siquijor.svg" alt="" />
    </div>
  </body>
</html>
